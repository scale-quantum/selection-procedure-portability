<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Selection Procedure Portability: three readings of one out-of-sample step</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#f4f1ea; --paper2:#ebe6da; --ink:#141417; --ink2:#3b3b42; --muted:#7a776f; --rule:#d6d0c2;
  --sel:#d4471c; --fin:#2350c8; --ok:#2f7d4f; --bad:#b3261e;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:rgba(20,20,23,.14)}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 44px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:54px;font-family:var(--sans);font-size:13px}
.top .title{font-weight:600;letter-spacing:.01em}
.top .title span{font-weight:400;color:var(--muted);margin-left:8px}
.top .right{display:flex;align-items:center;gap:22px;color:var(--ink2)}
.top .right a{text-decoration:none}
.top .right a:hover{text-decoration:underline}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;font-family:var(--mono);font-size:11.5px}
.lang button{background:none;border:0;color:var(--muted);padding:5px 11px;cursor:pointer;font:inherit}
.lang button.on{background:var(--ink);color:var(--paper)}

/* hero */
.hero{padding:64px 0 0}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:80px;align-items:end}
.byline{font-family:var(--sans);font-size:13px;color:var(--muted);margin-bottom:18px;letter-spacing:.01em}
.byline b{color:var(--ink);font-weight:500}
h1{font-family:var(--serif);font-weight:450;font-size:clamp(36px,3.8vw,56px);line-height:1.02;letter-spacing:-.025em}
h1 em{font-style:normal;font-weight:450;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.lede{font-size:17px;line-height:1.55;color:var(--ink2);padding-bottom:6px}
.lede strong{color:var(--ink);font-weight:500}

/* figures */
.figure{margin-top:48px;border-top:1.5px solid var(--ink);padding-top:16px}
.hero .figure{margin-top:48px}
.fig-grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:36px;align-items:stretch}
canvas.cloud{display:block;width:100%;height:440px}
.caption{font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--muted);font-style:normal;margin-top:14px;max-width:820px}
.caption b{font-style:normal;font-family:var(--sans);font-weight:600;color:var(--ink);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-right:10px}
.side{display:flex;flex-direction:column;border-left:1px solid var(--rule);padding-left:28px}
.ro{padding:16px 0 18px;border-bottom:1px solid var(--rule)}
.ro:first-child{padding-top:4px}
.ro:last-child{border-bottom:0}
.k{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ro .v{display:flex;align-items:baseline;gap:10px;margin-top:6px;font-family:var(--sans);font-size:52px;font-weight:500;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;transition:color .25s}
.ro .v small{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:400}
.ro .s{font-family:var(--sans);font-size:13px;font-style:normal;color:var(--muted);margin-top:6px}
.ro .lv{display:flex;align-items:center;gap:10px;margin-top:10px}
.auto{font:500 11px var(--mono);border:1px solid var(--rule);background:none;border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--muted);white-space:nowrap}
.auto.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* controls */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1.5px;background:var(--ink)}
input[type=range]::-moz-range-track{height:1.5px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);margin-top:-7px}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink)}
input[type=range]:active::-webkit-slider-thumb{background:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:18px 40px;align-items:flex-end;padding-bottom:18px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:220px;flex:1;max-width:360px}
.ctl label{font-family:var(--sans);font-size:13px;display:flex;justify-content:space-between;gap:12px}
.ctl label b{font-family:var(--mono);font-weight:500}
.ctl .hint{font-family:var(--sans);font-size:13px;font-style:normal;color:var(--muted);line-height:1.35}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:500 13px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.btn:hover{background:var(--paper2)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:#2a2a30}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;font:500 13px var(--sans);padding:7px 14px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}

/* sections */
section{padding:148px 0 48px}
.sec-grid{display:grid;grid-template-columns:minmax(0,680px) minmax(0,1fr);gap:72px}
.sec-num{font-family:var(--mono);font-size:13px;color:var(--ink)}
h2{font-family:var(--serif);font-weight:450;font-size:clamp(36px,3.8vw,56px);line-height:1.02;letter-spacing:-.025em;margin:10px 0 28px}
h2 em{font-style:normal;font-weight:450;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;white-space:nowrap}
.prose p{color:var(--ink2)}
.prose p + p{margin-top:.9em}
.prose strong{color:var(--ink);font-weight:500}
.aside{align-self:end;font-family:var(--sans);font-size:14px;line-height:1.55;color:var(--muted);border-left:1.5px solid var(--ink);padding-left:18px;max-width:360px}
.aside b{color:var(--ink);font-weight:500}

.below{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;border-top:1px solid var(--rule);margin-top:8px;padding-top:20px}
.stat{font-family:var(--sans);font-size:14px;color:var(--muted)}
.stat b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.verdict{font-family:var(--serif);font-size:34px;line-height:1.12;margin-top:10px;font-weight:380;letter-spacing:-.01em;transition:color .25s}
canvas.hist{display:block;width:100%;height:200px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--rule);margin-top:8px}
.card{padding:20px 22px 22px 0;position:relative}
.card + .card{padding-left:22px;border-left:1px solid var(--rule)}
.card .big{font-family:var(--sans);font-size:32px;line-height:1.1;margin-top:8px;font-weight:500;letter-spacing:-.02em;transition:color .25s}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:8px;font-family:var(--mono)}
.mark{position:absolute;top:18px;right:18px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--sans);transition:all .25s}
.mark.ok{background:var(--ok);color:var(--paper)}
.mark.bad{background:var(--bad);color:var(--paper)}
.mark.meh{background:var(--paper2);color:var(--muted)}
.sweep-wrap{border-top:1px solid var(--rule);padding-top:18px}
canvas.sweep{display:block;width:100%;height:230px;margin-top:6px}

/* footer */
footer{margin-top:56px;border-top:1.5px solid var(--ink)}
footer .wrap{display:grid;grid-template-columns:minmax(0,680px) minmax(0,1fr);gap:72px;padding-top:40px;padding-bottom:80px}
footer h3{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
footer p{font-size:16px;color:var(--ink2)}
.cite{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--ink2);background:var(--paper2);padding:14px 16px;border-radius:4px;margin-top:14px;word-break:break-word}
.cite-note{font-size:14.5px;line-height:1.45;color:var(--muted);margin-top:12px}
footer .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
footer .links a{text-decoration:none}

.reveal{opacity:0;transform:translateY(16px);transition:opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

@media (max-width: 1000px){
  .hero-grid,.fig-grid,.sec-grid,.below,footer .wrap{grid-template-columns:1fr;gap:28px}
  .side{border-left:0;padding-left:0;border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .ro{border-bottom:0}
  .ro .v{font-size:40px}
  .aside{align-self:start}
}
@media (max-width: 700px){
  .wrap{padding:0 20px}
  .side{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .card + .card{padding-left:0;border-left:0;border-top:1px solid var(--rule)}
  .top .title span,.top .right a{display:none}
  canvas.cloud{height:400px}
}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <div class="title">Selection Procedure Portability<span data-i18n="top_sub"></span></div>
    <div class="right">
      <a href="https://doi.org/10.5281/zenodo.23324761" target="_blank" rel="noopener" data-i18n="l_paper"></a>
      <a href="https://github.com/scale-quantum/selection-procedure-portability" target="_blank" rel="noopener" data-i18n="l_code"></a>
      <div class="lang"><button data-lang="en">EN</button><button data-lang="ru">RU</button></div>
    </div>
  </div>
</div>

<main class="wrap">

<header class="hero">
  <div class="hero-grid">
    <div>
      <div class="byline" data-i18n="byline"></div>
      <h1 data-i18n="h1"></h1>
    </div>
    <p class="lede" data-i18n="lede"></p>
  </div>
  <div class="figure">
    <div class="fig-grid">
      <canvas class="cloud" id="heroCanvas"></canvas>
      <div class="side">
        <div class="ro">
          <div class="k" data-i18n="ro_level"></div>
          <div class="v" id="roLevel">—</div>
          <div class="lv"><input type="range" id="hLevel" min="-0.7" max="0.7" step="0.01" value="0" /><button class="auto on" id="hAuto" data-i18n="ro_auto"></button></div>
        </div>
        <div class="ro">
          <div class="k" data-i18n="ro_sign"></div>
          <div class="v" id="roSign">—</div>
          <div class="s" data-i18n="ro_sign_s"></div>
        </div>
        <div class="ro">
          <div class="k" data-i18n="ro_place"></div>
          <div class="v" id="roPlace" style="color:var(--sel)">—</div>
          <div class="s" data-i18n="ro_place_s"></div>
        </div>
      </div>
    </div>
    <p class="caption" data-i18n="cap1"></p>
  </div>
</header>

<section id="finger">
  <div class="sec-grid reveal">
    <div class="prose">
      <div class="sec-num">§1</div>
      <h2 data-i18n="f_h2"></h2>
      <p data-i18n="f_p1"></p>
      <p data-i18n="f_p2"></p>
    </div>
    <p class="aside" data-i18n="f_aside"></p>
  </div>
  <div class="figure reveal">
    <div class="controls">
      <div class="ctl">
        <label><span data-i18n="ctl_memory"></span><b id="fRhoV"></b></label>
        <input type="range" id="fRho" min="-1" max="1" step="0.05" value="0.6" />
        <div class="hint" data-i18n="ctl_memory_hint"></div>
      </div>
      <div class="ctl">
        <label><span data-i18n="ctl_level"></span><b id="fLevelV"></b></label>
        <input type="range" id="fLevel" min="-0.7" max="0.7" step="0.02" value="0.2" />
        <div class="hint" data-i18n="ctl_level_hint"></div>
      </div>
      <div class="btns">
        <div class="seg"><button id="fPast" data-i18n="btn_past"></button><button id="fFuture" class="on" data-i18n="btn_future"></button></div>
        <div class="seg"><button id="fAny" data-i18n="btn_any"></button><button id="fSame" class="on" data-i18n="btn_same"></button></div>
        <button class="btn primary" id="fThrow" data-i18n="btn_throw"></button>
        <button class="btn" id="fNew" data-i18n="btn_new"></button>
      </div>
    </div>
    <canvas class="cloud" id="fCanvas"></canvas>
    <div class="below">
      <div>
        <div class="stat" id="fCloudStat"></div>
        <div class="stat" id="fBeat" style="margin-top:4px"></div>
        <div class="verdict" id="fVerdict"></div>
      </div>
      <canvas class="hist" id="fHist"></canvas>
    </div>
    <p class="caption" data-i18n="cap2"></p>
  </div>
</section>

<section id="sign">
  <div class="sec-grid reveal">
    <div class="prose">
      <div class="sec-num">§2</div>
      <h2 data-i18n="s_h2"></h2>
      <p data-i18n="s_p1"></p>
      <p data-i18n="s_p2"></p>
    </div>
    <p class="aside" data-i18n="s_aside"></p>
  </div>
  <div class="figure reveal">
    <div class="controls">
      <div class="ctl">
        <label><span data-i18n="ctl_memory"></span><b id="sRhoV"></b></label>
        <input type="range" id="sRho" min="-1" max="1" step="0.05" value="0.7" />
      </div>
      <div class="ctl">
        <label><span data-i18n="ctl_level"></span><b id="sLevelV"></b></label>
        <input type="range" id="sLevel" min="-0.7" max="0.7" step="0.02" value="-0.52" />
      </div>
      <div class="btns">
        <button class="btn" data-preset="0" data-i18n="pr_1"></button>
        <button class="btn" data-preset="1" data-i18n="pr_2"></button>
        <button class="btn" data-preset="2" data-i18n="pr_3"></button>
      </div>
    </div>
    <canvas class="cloud" id="sCanvas"></canvas>
    <div class="cards">
      <div class="card"><div class="k" data-i18n="c_truth"></div><div class="big" id="cTruth"></div><div class="sub" data-i18n="truth_sub"></div></div>
      <div class="card"><div class="mark" id="mWfa"></div><div class="k" data-i18n="c_wfa"></div><div class="big" id="cWfa"></div><div class="sub" id="cWfaSub"></div></div>
      <div class="card"><div class="mark" id="mSpp"></div><div class="k" data-i18n="c_spp"></div><div class="big" id="cSpp"></div><div class="sub" id="cSppSub"></div></div>
    </div>
    <div class="sweep-wrap">
      <div class="k" data-i18n="sw_title"></div>
      <canvas class="sweep" id="sSweep"></canvas>
    </div>
    <p class="caption" data-i18n="cap3"></p>
  </div>
</section>

</main>

<footer>
  <div class="wrap">
    <div>
      <h3 data-i18n="ab_h"></h3>
      <p data-i18n="ab_p"></p>
    </div>
    <div>
      <h3 data-i18n="ci_h"></h3>
      <div class="cite">Kiriakov, M. (2026). The sign of the selected candidate's P&amp;L conflates the level of the test period with the quality of selection. Zenodo. https://doi.org/10.5281/zenodo.23324761</div>
      <p class="cite-note" data-i18n="ci_note"></p>
      <div class="links">
        <a class="btn" href="https://doi.org/10.5281/zenodo.23324761" target="_blank" rel="noopener" data-i18n="l_paper"></a>
        <a class="btn" href="https://github.com/scale-quantum/selection-procedure-portability" target="_blank" rel="noopener" data-i18n="l_code"></a>
      </div>
    </div>
  </div>
</footer>

"use strict";

/* ───────────── i18n ───────────── */

  ro_level:"Period level", ro_auto:"auto", lvl_strong:"strong", lvl_weak:"weak", lvl_flat:"flat",

    ctx.strokeStyle = `rgba(${INK},.7)`;
    ctx.beginPath(); ctx.moveTo(x0 + .5, top); ctx.lineTo(x0 + .5, bot + 6); ctx.stroke();
    ctx.font = FONT_SERIF_I; ctx.fillStyle = MUTED;
    ctx.textAlign = "right"; ctx.fillText("← " + t("loss"), x0 - 10, top + 14);
    ctx.textAlign = "left";  ctx.fillText(t("profit") + " →", x0 + 10, top + 14);
    ctx.font = FONT_MONO; ctx.textAlign = "center"; ctx.fillStyle = `rgba(${INK},.75)`; ctx.fillText("0", x0, bot + 20);

    const small = this.w < 600, r0 = small ? 1.15 : 1.5;
    ctx.fillStyle = `rgba(${INK},.5)`;  this.dots(i => this.role[i] === 0 && this.v[i] > 0, r0);
    ctx.fillStyle = `rgba(${INK},.2)`;  this.dots(i => this.role[i] === 0 && this.v[i] <= 0, r0);
    ctx.fillStyle = FIN; this.dots(i => this.role[i] === 2, small ? 1.7 : 2.1);
    ctx.fillStyle = SEL; this.dots(i => this.role[i] === 1, small ? 1.9 : 2.4);

    const cx = this.x[W.champ], cy = this.y[W.champ];
    ctx.strokeStyle = `rgb(${INK})`; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(cx, cy, 6.5, 0, 6.2832); ctx.stroke();
    const right = cx < this.w - 170, ly = Math.max(top + 30, cy - 34);
    ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(cx + (right ? 5 : -5), cy - 5); ctx.lineTo(cx + (right ? 22 : -22), ly + 4); ctx.stroke();
    ctx.font = FONT_SERIF_I; ctx.textAlign = right ? "left" : "right";
    ctx.lineJoin = "round"; ctx.strokeStyle = "rgba(244,241,234,.92)"; ctx.lineWidth = 5;
    ctx.strokeText(t("champ"), cx + (right ? 26 : -26), ly + 8);
    ctx.fillStyle = `rgb(${INK})`; ctx.fillText(t("champ"), cx + (right ? 26 : -26), ly + 8);

    const tri = (v, col) => { const x = this.sx(v); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, bot + 3); ctx.lineTo(x - 4.5, bot + 11); ctx.lineTo(x + 4.5, bot + 11); ctx.closePath(); ctx.fill(); };
    tri(this.cloudMean, `rgba(${INK},.45)`);
    if (this.randMean != null) tri(this.randMean, FIN);
    tri(this.selMean, SEL);

    // rank strip
    const sy = this.h - 26, narrow = this.w < 720, titleY = narrow ? bot + 40 : bot + 52;
    ctx.font = FONT_SANS; ctx.fillStyle = MUTED; ctx.textAlign = "left";
    spacedText(ctx, t("strip"), L, titleY);
    ctx.font = FONT_MONO;
    const s1 = t("strip_sel", { m: Math.round(this.selPlace) });
    const s2 = this.randPlace != null ? t("strip_fin", { m: Math.round(this.randPlace) }) : null;
    if (narrow){
      ctx.textAlign = "left"; ctx.fillStyle = SEL; ctx.fillText(s1, L, titleY + 17);
      if (s2){ ctx.fillStyle = FIN; ctx.fillText(s2, L + ctx.measureText(s1).width + 14, titleY + 17); }
    } else {
      ctx.textAlign = "right"; let rx = R;
      if (s2){ ctx.fillStyle = FIN; ctx.fillText(s2, rx, titleY); rx -= ctx.measureText(s2).width + 16; }
      ctx.fillStyle = SEL; ctx.fillText(s1, rx, titleY);
    }

    ctx.strokeStyle = `rgba(${INK},.55)`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L, sy + .5); ctx.lineTo(R, sy + .5); ctx.stroke();
    ctx.fillStyle = `rgba(${INK},.6)`; ctx.textAlign = "center";
    for (const p of [0, 25, 50, 75, 100]){
      const x = this.sr(p);
      ctx.beginPath(); ctx.moveTo(x + .5, sy); ctx.lineTo(x + .5, sy + 5); ctx.stroke();
      ctx.fillText(String(p), clamp(x, L + 8, R - 10), sy + 18);
    }
    ctx.lineWidth = 1;
    if (this.randPlace != null){
      ctx.strokeStyle = "rgba(35,80,200,.45)"; ctx.beginPath();
      for (let i = 0; i < N; i++) if (this.role[i] === 2){ const x = Math.round(this.r[i]) + .5; ctx.moveTo(x, sy - 34); ctx.lineTo(x, sy - 22); }
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(212,71,28,.5)"; ctx.beginPath();
    for (const i of W.topIdx){ const x = Math.round(this.r[i]) + .5; ctx.moveTo(x, sy - 17); ctx.lineTo(x, sy - 3); }
    ctx.stroke();
    const mx = this.sr(this.selPlace);
    ctx.fillStyle = SEL; ctx.beginPath(); ctx.moveTo(mx, sy + 1); ctx.lineTo(mx - 5, sy + 9); ctx.lineTo(mx + 5, sy + 9); ctx.closePath(); ctx.fill();
    if (this.randPlace != null){
      const fx = this.sr(this.randPlace);
      ctx.fillStyle = FIN; ctx.beginPath(); ctx.moveTo(fx, sy + 1); ctx.lineTo(fx - 5, sy + 9); ctx.lineTo(fx + 5, sy + 9); ctx.closePath(); ctx.fill();
    }
  }
}

/* ───────────── shared world ───────────── */
let SEED = 41;
const W = new World(SEED);

/* ───────────── hero ───────────── */
const hero = new CloudView(document.getElementById("heroCanvas"), W);
const heroVals = new Float32Array(N);
const hLevel = document.getElementById("hLevel"), hAuto = document.getElementById("hAuto");
const roLevel = document.getElementById("roLevel"), roSign = document.getElementById("roSign"), roPlace = document.getElementById("roPlace");
let heroT = 0, heroFrame = 0, heroAuto = true;
hLevel.addEventListener("input", () => { heroAuto = false; hAuto.classList.remove("on"); heroFrame = 0; });
hAuto.addEventListener("click", () => {
  heroAuto = !heroAuto; hAuto.classList.toggle("on", heroAuto);
  if (heroAuto) heroT = Math.asin(clamp((+hLevel.value + 0.12) / 0.52, -1, 1)) / 0.42;
});
function heroTick(){
  if (!hero.visible) return;
  if (heroAuto){
    heroT += 1 / 60;
    hLevel.value = (-0.12 + 0.52 * Math.sin(heroT * 0.42) + 0.06 * Math.sin(heroT * 1.3)).toFixed(3);
  }
  if (heroFrame++ % 3) return;
  const level = +hLevel.value;
  W.oos(0.8, level, heroVals);
  hero.set(heroVals);
  const r = readStep(W, heroVals);
  const word = level > 0.12 ? t("lvl_strong") : level < -0.12 ? t("lvl_weak") : t("lvl_flat");
  roLevel.innerHTML = `${fmtSigned(level, 2)}<small>${word}</small>`;
  roSign.innerHTML = `${r.topMean > 0 ? "+" : MINUS}<small>${t("ro_avg")} ${fmtSigned(r.topMean)}</small>`;
  roSign.style.color = r.topMean > 0 ? "var(--ink)" : "var(--muted)";
  roPlace.innerHTML = `${Math.round(r.place)}<small>/ 100</small>`;
}

/* ───────────── §1 · finger ───────────── */
const F = {
  view: new CloudView(document.getElementById("fCanvas"), W),
  rho: document.getElementById("fRho"), level: document.getElementById("fLevel"),
  vals: new Float32Array(N), mode: "future",
  nulls: new Float32Array(1000), count: 0, running: false, selMean: 0, matched: true,
  pool: Uint32Array.from({length:N}, (_, i) => i), mask: new Uint8Array(N),
  binPools: Array.from({length:NBINS}, () => new Uint32Array(0)),
  hist: document.getElementById("fHist")
};
function syncPools(){
  for (let b = 0; b < NBINS; b++){
    const src = W.bins[b];
    if (F.binPools[b].length !== src.length) F.binPools[b] = new Uint32Array(src.length);
    for (let i = 0; i < src.length; i++) F.binPools[b][i] = src[i];
  }
}
function fRecompute(){
  const rho = +F.rho.value, level = +F.level.value;
  document.getElementById("fRhoV").textContent = fmtSigned(rho, 2);
  document.getElementById("fLevelV").textContent = fmtSigned(level, 2);
  W.oos(rho, level, F.vals);
  let s = 0; for (const i of W.topIdx) s += F.vals[i]; F.selMean = s / TOP;
  syncPools();
  F.count = 0; F.running = false;
  F.view.set(F.mode === "future" ? F.vals : W.is);
  fStatus(); drawHist();
}
function throwOnce(){
  const mask = F.mask; mask.fill(0);
  let s = 0;
  if (!F.matched){
    const pool = F.pool;
    for (let k = 0; k < TOP; k++){
      const j = k + Math.floor(Math.random() * (N - k));
      const tmp = pool[k]; pool[k] = pool[j]; pool[j] = tmp;
      s += F.vals[pool[k]]; mask[pool[k]] = 1;
    }
    return s / TOP;
  }
  let got = 0;
  for (let b = 0; b < NBINS; b++){
    const need = W.topBinCount[b];
    if (!need) continue;
    const pool = F.binPools[b], L = pool.length;
    for (let k = 0; k < need; k++){
      const j = k + Math.floor(Math.random() * (L - k));
      const tmp = pool[k]; pool[k] = pool[j]; pool[j] = tmp;
      s += F.vals[pool[k]]; mask[pool[k]] = 1;
    }
    got += need;
  }
  return s / got;
}
function fTick(){
  if (!F.running) return;
  let m = 0;
  for (let k = 0; k < 18 && F.count < 1000; k++){ m = throwOnce(); F.nulls[F.count++] = m; }
  if (F.mode === "future") F.view.setRandom(F.mask, m);
  if (F.count >= 1000) F.running = false;
  fStatus(); drawHist();
}
function fStatus(){
  const cloud = document.getElementById("fCloudStat"), beat = document.getElementById("fBeat"), ver = document.getElementById("fVerdict");
  if (F.mode === "past") cloud.innerHTML = t("f_cloud_past");
  else { let p = 0; for (let i = 0; i < N; i++) if (F.vals[i] > 0) p++; cloud.innerHTML = t("f_cloud", { p: Math.round(100 * p / N) }); }
  if (F.count === 0){ beat.innerHTML = "&nbsp;"; ver.textContent = t("f_prompt"); ver.style.color = "var(--muted)"; return; }
  let b = 0, mu = 0, sd = 0;
  for (let k = 0; k < F.count; k++){ if (F.nulls[k] < F.selMean) b++; mu += F.nulls[k]; }
  mu /= F.count; for (let k = 0; k < F.count; k++) sd += (F.nulls[k] - mu) ** 2; sd = Math.sqrt(sd / Math.max(1, F.count - 1));
  const z = sd > 0 ? (F.selMean - mu) / sd : 0;
  beat.innerHTML = t("f_beat", { b, n: F.count, z: fmt(z, 1) });
  if (F.running && F.count < 150){ ver.textContent = t("v_wait"); ver.style.color = "var(--muted)"; return; }
  // The finger spreads over all clusters; the frozen slice sits in a few, so its
  // raw z against the finger is inflated. Widen by the effective-cluster ratio.
  const cc = new Float64Array(C);
  for (const i of W.topIdx) cc[Math.floor(i / (N / C))]++;
  let hhi = 0; for (let k = 0; k < C; k++) hhi += (cc[k] / TOP) ** 2;
  const zAdj = z / Math.sqrt(C * hhi);
  const tail = F.matched ? "" : "_any";
  if (zAdj > 2){ ver.textContent = t("v_good" + tail); ver.style.color = "var(--ink)"; }
  else if (zAdj < -2){ ver.textContent = t("v_bad" + tail); ver.style.color = "var(--bad)"; }
  else { ver.textContent = t("v_null" + tail); ver.style.color = "var(--ink)"; }
}
function drawHist(){
  const c = F.hist, { w, h, d } = fitCanvas(c), ctx = c.getContext("2d");
  ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, w, h);
  const pl = 2, pr = 2, pt = 26, pb = 34;
  ctx.font = FONT_SANS; ctx.fillStyle = MUTED; ctx.textAlign = "left";
  spacedText(ctx, t(F.matched ? "nh_axis_same" : "nh_axis"), pl, h - 6);
  ctx.strokeStyle = `rgba(${INK},.5)`; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pl, h - pb + .5); ctx.lineTo(w - pr, h - pb + .5); ctx.stroke();
  if (F.count === 0) return;
  let lo = Infinity, hi = -Infinity;
  for (let k = 0; k < F.count; k++){ lo = Math.min(lo, F.nulls[k]); hi = Math.max(hi, F.nulls[k]); }
  lo = Math.min(lo, F.selMean); hi = Math.max(hi, F.selMean);
  const pad = (hi - lo) * 0.12 + 1; lo -= pad; hi += pad;
  const bins = 46, hs = new Float32Array(bins);
  for (let k = 0; k < F.count; k++) hs[clamp(Math.floor((F.nulls[k] - lo) / (hi - lo) * bins), 0, bins - 1)]++;
  let mx = 0; for (const v of hs) mx = Math.max(mx, v);
  const bw = (w - pl - pr) / bins;
  ctx.fillStyle = "rgba(35,80,200,.75)";
  for (let k = 0; k < bins; k++){
    const bh = hs[k] / Math.max(mx, 1) * (h - pt - pb);
    ctx.fillRect(pl + k * bw + .5, h - pb - bh, Math.max(1, bw - 1.5), bh);
  }
  const sx = v => pl + (v - lo) / (hi - lo) * (w - pl - pr);
  if (lo < 0 && hi > 0){
    ctx.strokeStyle = `rgba(${INK},.7)`; ctx.beginPath(); ctx.moveTo(sx(0) + .5, pt - 8); ctx.lineTo(sx(0) + .5, h - pb + 5); ctx.stroke();
    ctx.font = FONT_MONO; ctx.fillStyle = `rgba(${INK},.75)`; ctx.textAlign = "center"; ctx.fillText("0", sx(0), h - pb + 17);
  }
  const xs = sx(F.selMean);
  ctx.strokeStyle = SEL; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(xs, pt - 10); ctx.lineTo(xs, h - pb); ctx.stroke();
  ctx.font = FONT_SERIF_I; ctx.fillStyle = SEL; const rightSide = xs > w - 110;
  ctx.textAlign = rightSide ? "right" : "left";
  ctx.fillText(t("nh_sel"), xs + (rightSide ? -7 : 7), pt - 2);
}
function startThrows(){
  if (F.mode !== "future") setFMode("future");
  F.count = 0; F.running = true;
}
let throwTimer = 0;
function fOnInput(){
  fRecompute();
  clearTimeout(throwTimer);
  throwTimer = setTimeout(startThrows, 350);
}
F.rho.addEventListener("input", fOnInput);
F.level.addEventListener("input", fOnInput);
document.getElementById("fThrow").addEventListener("click", startThrows);
new IntersectionObserver((es, obs) => {
  if (es[0].isIntersecting){ setTimeout(startThrows, 400); obs.disconnect(); }
}, { threshold: 0.5 }).observe(document.getElementById("fCanvas"));
function setFMode(m){
  F.mode = m;
  document.getElementById("fPast").classList.toggle("on", m === "past");
  document.getElementById("fFuture").classList.toggle("on", m === "future");
  F.view.set(m === "future" ? F.vals : W.is);
  fStatus();
}
document.getElementById("fPast").addEventListener("click", () => setFMode("past"));
document.getElementById("fFuture").addEventListener("click", () => setFMode("future"));
function setFinger(matched){
  F.matched = matched;
  document.getElementById("fAny").classList.toggle("on", !matched);
  document.getElementById("fSame").classList.toggle("on", matched);
  startThrows();
}
document.getElementById("fAny").addEventListener("click", () => setFinger(false));
document.getElementById("fSame").addEventListener("click", () => setFinger(true));
document.getElementById("fNew").addEventListener("click", newWorld);

/* ───────────── §2 · sign vs place ───────────── */
const S = {
  view: new CloudView(document.getElementById("sCanvas"), W),
  rho: document.getElementById("sRho"), level: document.getElementById("sLevel"),
  vals: new Float32Array(N), sweepVals: new Float32Array(N), sweep: null, sweepKey: null,
  canvas: document.getElementById("sSweep")
};
const PRESETS = [ [0.7, -0.52], [-0.5, 0.6], [0, 0.3] ];
const LEVELS = Array.from({length:57}, (_, k) => -0.7 + 1.4 * k / 56);
function sRecompute(resweep){
  const rho = +S.rho.value, level = +S.level.value;
  document.getElementById("sRhoV").textContent = fmtSigned(rho, 2);
  document.getElementById("sLevelV").textContent = fmtSigned(level, 2);
  W.oos(rho, level, S.vals);
  S.view.set(S.vals);
  const r = readStep(W, S.vals);
  const truth = rho > 0.15 ? "kept" : rho < -0.15 ? "inv" : "none";
  document.getElementById("cTruth").textContent = t("truth_" + truth);
  const keep = r.topMean > 0;
  document.getElementById("cWfa").textContent = keep ? t("wfa_keep") : t("wfa_drop");
  document.getElementById("cWfaSub").textContent = t("wfa_sub", { v: fmtSigned(r.topMean), c: fmtSigned(r.champ) });
  setMark("mWfa", keep === (truth === "kept") ? "ok" : "bad");
  const spp = r.mplace >= 65 ? "carry" : r.mplace <= 35 ? "inv" : "none";
  document.getElementById("cSpp").textContent = t("spp_" + spp);
  document.getElementById("cSppSub").textContent = t("spp_sub", { m: Math.round(r.mplace), p: Math.round(r.place), ic: fmt(r.ic, 2) });
  const match = (spp === "carry" && truth === "kept") || (spp === "inv" && truth === "inv") || (spp === "none" && truth === "none");
  const contra = (spp === "carry" && truth !== "kept") || (spp === "inv" && truth !== "inv");
  setMark("mSpp", match ? "ok" : contra ? "bad" : "meh");
  if (resweep || !S.sweep) computeSweep(rho);
  drawSweep(level);
}
function setMark(id, cls){
  const el = document.getElementById(id);
  el.className = "mark " + cls;
  el.textContent = cls === "ok" ? "✓" : cls === "bad" ? "✕" : "~";
}
function computeSweep(rho){
  const key = rho + ":" + W.version;
  if (S.sweepKey === key) return;
  S.sweepKey = key;
  S.sweep = LEVELS.map(l => { W.oos(rho, l, S.sweepVals); const r = readStep(W, S.sweepVals); return { l, champ: r.topMean, m: r.mplace, p: r.place }; });
}
const sweepHatch = makeHatch(S.canvas.getContext("2d"), 0.35);
function drawSweep(level){
  const c = S.canvas, { w, h, d } = fitCanvas(c), ctx = c.getContext("2d");
  ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, w, h);
  const pl = 30, pr = 4, bandY = 8, bandH = 18, pt = 46, pb = 52;
  const sx = l => pl + (l + 0.7) / 1.4 * (w - pl - pr);
  const sy = p => pt + (1 - p / 100) * (h - pt - pb);
  const step = (w - pl - pr) / (LEVELS.length - 1);
  S.sweep.forEach(s => {
    const x = sx(s.l) - step / 2 + .5;
    if (s.champ > 0){ ctx.fillStyle = `rgba(${INK},.85)`; ctx.fillRect(x, bandY, step - 1, bandH); }
    else { ctx.fillStyle = sweepHatch; ctx.fillRect(x, bandY, step - 1, bandH); ctx.strokeStyle = `rgba(${INK},.25)`; ctx.strokeRect(x + .5, bandY + .5, step - 2, bandH - 1); }
  });
  ctx.font = FONT_SANS; ctx.textAlign = "left"; ctx.fillStyle = MUTED;
  spacedText(ctx, t("sw_sign") + " · ■ " + t("sw_plus") + " ▨ " + t("sw_minus"), pl, bandY + bandH + 14);
  ctx.strokeStyle = `rgba(${INK},.1)`; ctx.lineWidth = 1;
  [0, 50, 100].forEach(p => { ctx.beginPath(); ctx.moveTo(pl, sy(p) + .5); ctx.lineTo(w - pr, sy(p) + .5); ctx.stroke(); });
  ctx.font = FONT_MONO; ctx.fillStyle = `rgba(${INK},.6)`; ctx.textAlign = "right";
  [0, 50, 100].forEach(p => ctx.fillText(String(p), pl - 6, sy(p) + 4));
  ctx.strokeStyle = "rgba(212,71,28,.55)"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.3; ctx.beginPath();
  S.sweep.forEach((s, k) => k ? ctx.lineTo(sx(s.l), sy(s.p)) : ctx.moveTo(sx(s.l), sy(s.p))); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = SEL; ctx.lineWidth = 2.2; ctx.beginPath();
  S.sweep.forEach((s, k) => k ? ctx.lineTo(sx(s.l), sy(s.m)) : ctx.moveTo(sx(s.l), sy(s.m))); ctx.stroke();
  const xl = sx(level);
  ctx.strokeStyle = `rgba(${INK},.9)`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(xl + .5, bandY - 4); ctx.lineTo(xl + .5, h - pb + 4); ctx.stroke();
  ctx.fillStyle = `rgb(${INK})`; ctx.beginPath(); ctx.arc(xl + .5, bandY - 4, 3, 0, 6.2832); ctx.fill();
  ctx.font = FONT_MONO; ctx.textAlign = "right"; ctx.fillStyle = `rgba(${INK},.6)`;
  ctx.fillText(t("sw_level"), w - pr, h - pb + 18);
  ctx.textAlign = "left"; ctx.fillStyle = SEL; ctx.fillText("━ " + t("sw_place"), pl, h - 6);
  const w1 = ctx.measureText("━ " + t("sw_place")).width;
  ctx.fillStyle = "rgba(212,71,28,.7)"; ctx.fillText("┅ " + t("sw_plain"), pl + 22 + w1, h - 6);
}
let sweepTimer = 0;
S.rho.addEventListener("input", () => {
  sRecompute(false);
  clearTimeout(sweepTimer);
  sweepTimer = setTimeout(() => sRecompute(true), 90);
});
S.level.addEventListener("input", () => sRecompute(false));
document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
  const [r, l] = PRESETS[+b.dataset.preset];
  animateSliders(r, l);
}));
function animateSliders(r1, l1){
  const r0 = +S.rho.value, l0 = +S.level.value, t0 = performance.now(), dur = 900;
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  (function go(now){
    const k = Math.min(1, (now - t0) / dur), e = ease(k);
    S.rho.value = (r0 + (r1 - r0) * e).toFixed(2);
    S.level.value = (l0 + (l1 - l0) * e).toFixed(3);
    sRecompute(k === 1);
    if (k < 1) requestAnimationFrame(go);
  })(t0);
}

/* ───────────── world reseed ───────────── */
function newWorld(){
  SEED = Math.floor(Math.random() * 1e9);
  W.reseed(SEED);
  fRecompute(); sRecompute(true);
  startThrows();
}

/* ───────────── loop & boot ───────────── */
function loop(){
  heroTick(); fTick();
  for (const v of VIEWS) v.step();
  requestAnimationFrame(loop);
}
listeners.push(() => { fStatus(); drawHist(); sRecompute(false); heroFrame = 0; });
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.1 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
window.addEventListener("resize", () => { drawHist(); if (S.sweep) drawSweep(+S.level.value); });

applyLang();
fRecompute();
sRecompute(true);
requestAnimationFrame(loop);
</script>
